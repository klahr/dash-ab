<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Isometric</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87c7e8;
        font-family: 'Trebuchet MS', Verdana, sans-serif;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      .hud {
        position: fixed;
        left: 10px;
        padding: 6px 10px;
        color: #fff8e0;
        font-size: 13px;
        background: #2b4a8b;
        border: 3px solid #f2b632;
        border-radius: 8px;
        box-shadow: 0 3px 0 #1a2e5a;
        text-shadow: 1px 1px 0 #1a2e5a;
      }
      #status {
        top: 10px;
        font-weight: bold;
      }
      #help {
        bottom: 10px;
        font-size: 12px;
      }
      #help kbd {
        display: inline-block;
        padding: 0 4px;
        margin: 0 1px;
        color: #2b2b2b;
        background: #ffe58a;
        border-radius: 3px;
        font-family: inherit;
        text-shadow: none;
      }

      .room-panel {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 290px;
        max-height: calc(100% - 20px);
        overflow: auto;
        color: #2a2a2a;
        background: linear-gradient(#fdf3d4, #f4e2b0);
        border: 4px solid #2b4a8b;
        border-radius: 12px;
        box-shadow:
          0 5px 0 #1a2e5a,
          0 10px 24px rgba(0, 0, 0, 0.35);
      }
      .room-panel[hidden] {
        display: none;
      }
      .room-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: linear-gradient(#ffd23f, #f2a516);
        border-bottom: 3px solid #b3741a;
      }
      .room-panel h2 {
        margin: 0;
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #3b2405;
      }
      .room-panel .close {
        width: 28px;
        height: 28px;
        font-size: 20px;
        line-height: 1;
        color: #fff;
        background: #e23b3b;
        border: 2px solid #8c1d1d;
        border-radius: 6px;
        cursor: pointer;
      }
      .room-panel .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 0;
        font-weight: bold;
      }
      .room-panel .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.3);
      }
      .room-panel .online .dot {
        background: #3fbf6a;
      }
      .room-panel .offline .dot {
        background: #8b8f99;
      }
      .room-panel .offline {
        color: #6b717c;
      }
      .room-panel .summary {
        margin: 4px 12px 8px;
        font-size: 13px;
        color: #5a4a2a;
      }
      .room-panel .slots {
        list-style: none;
        margin: 0;
        padding: 0 10px 10px;
      }
      .room-panel .slots li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 6px;
        padding: 6px 8px;
        background: #fffaf0;
        border: 2px solid #d8c48a;
        border-radius: 6px;
      }
      .room-panel .slots li.working {
        border-color: #46c2b4;
        background: #eafaf7;
      }
      .room-panel .slot-index {
        min-width: 26px;
        font-weight: bold;
        color: #2b4a8b;
      }
      .room-panel .task-title {
        font-size: 13px;
        font-weight: bold;
      }
      .room-panel .task-title.idle {
        font-weight: normal;
        color: #8a7a5a;
      }
      .room-panel .task-meta {
        font-size: 11px;
        color: #6b6050;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status" class="hud">loading…</div>
    <div id="help" class="hud">
      Drag/<kbd>WASD</kbd> pan · wheel zoom · <kbd>Q</kbd><kbd>E</kbd> rotate · click a room · mock:
      <kbd>N</kbd> add <kbd>X</kbd> remove <kbd>O</kbd> toggle online
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
