<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dash Isometric</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87c7e8;
        font-family: 'Trebuchet MS', Verdana, sans-serif;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      .hud {
        position: fixed;
        left: 10px;
        padding: 6px 10px;
        color: #fff8e0;
        font-size: 13px;
        background: #2b4a8b;
        border: 3px solid #f2b632;
        border-radius: 8px;
        box-shadow: 0 3px 0 #1a2e5a;
        text-shadow: 1px 1px 0 #1a2e5a;
      }
      #status {
        top: 10px;
        font-weight: bold;
      }
      #help {
        bottom: 10px;
        font-size: 12px;
      }
      #help kbd {
        display: inline-block;
        padding: 0 4px;
        margin: 0 1px;
        color: #2b2b2b;
        background: #ffe58a;
        border-radius: 3px;
        font-family: inherit;
        text-shadow: none;
      }

      .room-panel {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 290px;
        max-height: calc(100% - 20px);
        overflow: auto;
        color: #2a2a2a;
        background: linear-gradient(#fdf3d4, #f4e2b0);
        border: 4px solid #2b4a8b;
        border-radius: 12px;
        box-shadow:
          0 5px 0 #1a2e5a,
          0 10px 24px rgba(0, 0, 0, 0.35);
      }
      .room-panel[hidden] {
        display: none;
      }
      .room-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: linear-gradient(#ffd23f, #f2a516);
        border-bottom: 3px solid #b3741a;
      }
      .room-panel h2 {
        margin: 0;
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #3b2405;
      }
      .room-panel .close {
        width: 28px;
        height: 28px;
        font-size: 20px;
        line-height: 1;
        color: #fff;
        background: #e23b3b;
        border: 2px solid #8c1d1d;
        border-radius: 6px;
        cursor: pointer;
      }
      .room-panel .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 0;
        font-weight: bold;
      }
      .room-panel .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.3);
      }
      .room-panel .online .dot {
        background: #3fbf6a;
      }
      .room-panel .offline .dot {
        background: #8b8f99;
      }
      .room-panel .offline {
        color: #6b717c;
      }
      .room-panel .summary {
        margin: 4px 12px 8px;
        font-size: 13px;
        color: #5a4a2a;
      }
      .room-panel .slots {
        list-style: none;
        margin: 0;
        padding: 0 10px 10px;
      }
      .room-panel .slots li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 6px;
        padding: 6px 8px;
        background: #fffaf0;
        border: 2px solid #d8c48a;
        border-radius: 6px;
      }
      .room-panel .slots li.working {
        border-color: #46c2b4;
        background: #eafaf7;
      }
      .room-panel .slot-index {
        min-width: 26px;
        font-weight: bold;
        color: #2b4a8b;
      }
      .room-panel .task-title {
        font-size: 13px;
        font-weight: bold;
      }
      .room-panel .task-title.idle {
        font-weight: normal;
        color: #8a7a5a;
      }
      .room-panel .task-meta {
        font-size: 11px;
        color: #6b6050;
      }
      .room-panel .task-card {
        margin: 8px 10px 12px;
        padding: 8px 10px;
        background: #fffaf0;
        border: 2px solid #d8c48a;
        border-radius: 8px;
      }
      .room-panel .task-card .task-title {
        font-size: 15px;
      }
      .room-panel .task-card .task-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
      }
      .room-panel .tag,
      .room-panel .pill {
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: bold;
        color: #fff;
        background: #2b4a8b;
      }
      .room-panel .pill.in_progress,
      .room-panel .pill.merging {
        background: #2f9e93;
      }
      .room-panel .pill.review,
      .room-panel .pill.merged {
        background: #3fbf6a;
      }
      .room-panel .pill.failed {
        background: #e23b3b;
      }
      .room-panel .pill.queued,
      .room-panel .pill.draft {
        background: #8b8f99;
      }
      .room-panel .task-id {
        margin-top: 6px;
        font: 11px monospace;
        color: #8a7a5a;
      }
      .room-panel .goals {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
      }
      .room-panel .last.success {
        color: #2c8a4c;
      }
      .room-panel .last.failure {
        color: #b02a2a;
      }

      #ask-pm {
        right: 10px;
        bottom: 10px;
        left: auto;
        font:
          bold 14px 'Trebuchet MS',
          Verdana,
          sans-serif;
        cursor: pointer;
      }
      #ask-pm:hover {
        background: #3a60b3;
      }
      #ask-pm kbd {
        display: inline-block;
        padding: 0 4px;
        color: #2b2b2b;
        background: #ffe58a;
        border-radius: 3px;
        font: inherit;
        text-shadow: none;
      }
      #ask-pm.busy::after {
        content: ' …';
      }

      .chat-panel {
        position: fixed;
        right: 10px;
        bottom: 56px;
        display: flex;
        flex-direction: column;
        width: 360px;
        height: min(480px, calc(100% - 76px));
        color: #2a2a2a;
        background: linear-gradient(#fdf3d4, #f4e2b0);
        border: 4px solid #2b4a8b;
        border-radius: 12px;
        box-shadow:
          0 5px 0 #1a2e5a,
          0 10px 24px rgba(0, 0, 0, 0.35);
        z-index: 10;
      }
      .chat-panel[hidden] {
        display: none;
      }
      .chat-panel header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        background: linear-gradient(#ffd23f, #f2a516);
        border-bottom: 3px solid #b3741a;
      }
      .chat-panel .portrait {
        width: 40px;
        height: 40px;
        font-size: 28px;
        line-height: 40px;
        text-align: center;
        background: #cfe8f7;
        border: 3px solid #2b4a8b;
        border-radius: 6px;
      }
      .chat-panel .title {
        flex: 1;
      }
      .chat-panel h2 {
        margin: 0;
        font-size: 17px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #3b2405;
      }
      .chat-panel small {
        font-size: 11px;
        color: #6b4a14;
      }
      .chat-panel .close {
        width: 28px;
        height: 28px;
        font-size: 20px;
        line-height: 1;
        color: #fff;
        background: #e23b3b;
        border: 2px solid #8c1d1d;
        border-radius: 6px;
        cursor: pointer;
      }
      .chat-panel .log {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
      .chat-panel .empty {
        padding: 8px;
        font-size: 13px;
        color: #6b6050;
        font-style: italic;
      }
      .chat-panel .msg {
        max-width: 88%;
        margin-bottom: 8px;
        padding: 6px 10px;
        font-size: 13px;
        line-height: 1.4;
        border: 2px solid #d8c48a;
        border-radius: 8px;
        background: #fffaf0;
        overflow-wrap: anywhere;
      }
      .chat-panel .msg.user {
        margin-left: auto;
        color: #fff8e0;
        background: #2b4a8b;
        border-color: #1a2e5a;
      }
      .chat-panel .msg.system {
        max-width: 100%;
        font-size: 12px;
        font-style: italic;
        color: #7a3b1c;
        background: #fde4d0;
        border-color: #e0a77a;
      }
      .chat-panel .msg.user .body {
        white-space: pre-wrap;
      }
      .chat-panel time {
        display: block;
        margin-top: 2px;
        font-size: 10px;
        opacity: 0.55;
        text-align: right;
      }
      .chat-panel .body > :first-child {
        margin-top: 0;
      }
      .chat-panel .body > :last-child {
        margin-bottom: 0;
      }
      .chat-panel .body p,
      .chat-panel .body ul,
      .chat-panel .body ol,
      .chat-panel .body pre,
      .chat-panel .body blockquote {
        margin: 0.4em 0;
      }
      .chat-panel .body ul,
      .chat-panel .body ol {
        padding-left: 1.3em;
      }
      .chat-panel .body h3,
      .chat-panel .body h4,
      .chat-panel .body h5,
      .chat-panel .body h6 {
        margin: 0.5em 0 0.2em;
        font-size: 14px;
      }
      .chat-panel .body code {
        padding: 0 3px;
        font-size: 12px;
        background: #efe3bd;
        border-radius: 3px;
      }
      .chat-panel .body pre {
        padding: 6px 8px;
        overflow-x: auto;
        background: #efe3bd;
        border-radius: 4px;
      }
      .chat-panel .body pre code {
        padding: 0;
        background: none;
      }
      .chat-panel .body blockquote {
        padding-left: 8px;
        color: #6b6050;
        border-left: 3px solid #d8c48a;
      }
      .chat-panel .body a {
        color: #1f5fbf;
      }
      .chat-panel .typing {
        display: inline-flex;
        gap: 4px;
        padding: 9px 12px;
      }
      .chat-panel .typing[hidden] {
        display: none;
      }
      .chat-panel .typing span {
        width: 7px;
        height: 7px;
        background: #2b4a8b;
        border-radius: 50%;
        animation: chat-dot 1.1s infinite ease-in-out;
      }
      .chat-panel .typing span:nth-child(2) {
        animation-delay: 0.18s;
      }
      .chat-panel .typing span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes chat-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      .chat-panel .composer {
        display: flex;
        gap: 6px;
        padding: 8px;
        background: #e9d59c;
        border-top: 3px solid #b3741a;
      }
      .chat-panel .composer input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        font:
          13px 'Trebuchet MS',
          Verdana,
          sans-serif;
        border: 2px solid #2b4a8b;
        border-radius: 6px;
      }
      .chat-panel .send {
        padding: 0 12px;
        font:
          bold 13px 'Trebuchet MS',
          Verdana,
          sans-serif;
        color: #fff;
        background: #3fae3a;
        border: 2px solid #1f6b1c;
        border-radius: 6px;
        cursor: pointer;
      }
      .chat-panel .send:disabled {
        background: #8b8f99;
        border-color: #5a5e66;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status" class="hud">loading…</div>
    <div id="help" class="hud">
      Drag/<kbd>WASD</kbd> pan · wheel zoom · <kbd>Q</kbd><kbd>E</kbd> rotate · click a room, a
      worker or the PM · <kbd>C</kbd> chat · <code>?fixture</code>: <kbd>N</kbd> add
      <kbd>X</kbd> remove <kbd>O</kbd> online <kbd>T</kbd> task <kbd>Y</kbd>/<kbd>⇧Y</kbd> slots
    </div>
    <button id="ask-pm" class="hud" type="button" title="Talk to the project manager">
      💬 Ask the PM <kbd>C</kbd>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
